<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bangalore Home Price Prediction</title>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.4.1/jquery.min.js"></script>
    <link rel="stylesheet" href="app.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
</head>

<body>
    <div class="animated-background">
        <div class="gradient-blob blob-1"></div>
        <div class="gradient-blob blob-2"></div>
        <div class="gradient-blob blob-3"></div>
        <div class="gradient-blob blob-4"></div>
        <div class="particles-container" id="particles"></div>
    </div>
    <div class="container">
        <div class="card">
            <div class="header">
                <h1 class="title">
                    Bangalore Home Price Predictor
                </h1>
                <p class="subtitle">Get instant price estimates for properties in Bangalore</p>
            </div>

            <form class="form" id="predictionForm">
                <div class="form-group">
                    <label for="uiSqft" class="form-label">
                        Area (Square Feet)
                    </label>
                    <input type="number" id="uiSqft" class="form-input" name="Squareft" value="1000" min="100" step="50"
                        required placeholder="Enter area in sqft">
                </div>

                <div class="form-group">
                    <label class="form-label">
                        BHK
                    </label>
                    <div class="switch-field">
                        <input type="radio" id="radio-bhk-1" name="uiBHK" value="1" />
                        <label for="radio-bhk-1">1</label>
                        <input type="radio" id="radio-bhk-2" name="uiBHK" value="2" checked />
                        <label for="radio-bhk-2">2</label>
                        <input type="radio" id="radio-bhk-3" name="uiBHK" value="3" />
                        <label for="radio-bhk-3">3</label>
                        <input type="radio" id="radio-bhk-4" name="uiBHK" value="4" />
                        <label for="radio-bhk-4">4</label>
                        <input type="radio" id="radio-bhk-5" name="uiBHK" value="5" />
                        <label for="radio-bhk-5">5</label>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label">
                        Bathrooms
                    </label>
                    <div class="switch-field">
                        <input type="radio" id="radio-bath-1" name="uiBathrooms" value="1" />
                        <label for="radio-bath-1">1</label>
                        <input type="radio" id="radio-bath-2" name="uiBathrooms" value="2" checked />
                        <label for="radio-bath-2">2</label>
                        <input type="radio" id="radio-bath-3" name="uiBathrooms" value="3" />
                        <label for="radio-bath-3">3</label>
                        <input type="radio" id="radio-bath-4" name="uiBathrooms" value="4" />
                        <label for="radio-bath-4">4</label>
                        <input type="radio" id="radio-bath-5" name="uiBathrooms" value="5" />
                        <label for="radio-bath-5">5</label>
                    </div>
                </div>

                <div class="form-group">
                    <label for="uiLocations" class="form-label">
                        Location
                        <button type="button" class="refresh-btn" onclick="loadLocations()" title="Refresh locations">
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24"
                                fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                stroke-linejoin="round">
                                <path d="M23 4v6h-6"></path>
                                <path d="M1 20v-6h6"></path>
                                <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path>
                            </svg>
                        </button>
                    </label>
                    <select class="form-select" id="uiLocations" name="location" required>
                        <option value="" disabled selected>Choose a Location</option>
                        <option value="" disabled>Loading locations...</option>
                    </select>
                    <div id="locationStatus" class="location-status"></div>
                </div>

                <button type="button" class="submit-btn" onclick="onClickedEstimatePrice()" id="estimateBtn">
                    <span class="btn-text">Estimate Price</span>
                    <span class="btn-loader" id="btnLoader"></span>
                </button>

                <div id="uiEstimatedPrice" class="result-container">
                    <div class="result-label">Estimated Price</div>
                    <div class="result-value" id="resultValue">--</div>
                </div>
            </form>
        </div>
    </div>

    <script src="app.js"></script>
</body>

</html>
